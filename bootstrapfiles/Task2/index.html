
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Carousel Controls</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="text-center mb-4">
            Explore the World
        </h1>
        <div id="myCarousel" class="carousel slide">

            <div class="carousel-inner">


                <div class="carousel-item active">
                    <img
                        src="https://picsum.photos/id/1018/1200/500"
                        class="d-block w-100"
                        alt="Mountain landscape"
                    >
                    <div class="carousel-caption">
                        <h5>Mountains</h5>
                    </div>
                </div>


                <div class="carousel-item">
                    <img
                        src="https://picsum.photos/id/1015/1200/500"
                        class="d-block w-100"
                        alt="River landscape"
                    >
                    <div class="carousel-caption">
                        <h5>Rivers</h5>
                    </div>
                </div>

                <div class="carousel-item">
                    <img
                        src="https://picsum.photos/id/1016/1200/500"
                        class="d-block w-100"
                        alt="Forest landscape"
                    >
                    <div class="carousel-caption">
                        <h5>Forests</h5>
                    </div>
                </div>

            </div>

        </div>

        <div class="text-center mt-4">

            <button class="btn btn-primary m-1" onclick="showSlide(0)">
                Show Mountains
            </button>

            <button class="btn btn-success m-1" onclick="showSlide(1)">
                Show Rivers
            </button>

            <button class="btn btn-danger m-1" onclick="showSlide(2)">
                Show Forests
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    
    <script>
        const carouselElement = document.getElementById("myCarousel");

        const carousel = new bootstrap.Carousel(carouselElement, {
            interval: false,
            ride: false
        });

        function showSlide(index) {
            carousel.to(index);
        }
    </script>

</body>
</html>
