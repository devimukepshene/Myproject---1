<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nested Bootstrap Grid</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


    <section class="py-5">

        <div class="container">


            <h1 class="text-center mb-5">
                Nested Bootstrap Grid
            </h1>


            <div class="row g-4">


                <div class="col-lg-8">


                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h2 class="card-title">
                                Main Content
                            </h2>

                            <p class="card-text">
                                This is the main content area.
                            </p>

                        </div>

                    </div>


                    <div class="row mt-4">


                        <div class="col-md-6">

                            <div class="card h-100">

                                <div class="card-body">

                                    <h3 class="card-title">
                                        Item 1
                                    </h3>

                                    <p class="card-text">
                                        This is the first nested grid item.
                                    </p>

                                </div>

                            </div>

                        </div>


                        <div class="col-md-6">

                            <div class="card h-100">

                                <div class="card-body">

                                    <h3 class="card-title">
                                        Item 2
                                    </h3>

                                    <p class="card-text">
                                        This is the second nested grid item.
                                    </p>

                                </div>

                            </div>

                        </div>


                    </div>


                </div>


                <div class="col-lg-4">

                    <div class="card shadow-sm h-100">

                        <div class="card-body">

                            <h2 class="card-title">
                                Sidebar
                            </h2>

                            <p class="card-text">
                                This is the sidebar area containing additional information.
                            </p>

                        </div>

                    </div>

                </div>


            </div>


        </div>

    </section>


</body>

</html>
