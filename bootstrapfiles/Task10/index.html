
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Checkout Page</title>

    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4 py-md-5">

        <header class="mb-4">
            <h1 class="h2">Checkout</h1>
            <p class="text-secondary mb-0">
                Complete your billing and shipping details.
            </p>
        </header>

        <form id="checkoutForm">
            <div class="row g-4">

                <div class="col-12 col-lg-7">

                  
                    <section class="card shadow-sm mb-4">
                        <div class="card-body p-4">

                            <h2 class="h4 mb-4">Billing Details</h2>

                            <div class="row g-3">

                                <div class="col-12 col-md-6">
                                    <label for="fullName"
                                           class="form-label">
                                        Full Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="fullName"
                                        name="fullName"
                                        autocomplete="name"
                                        required>
                                </div>
                        
                                <div class="col-12 col-md-6">
                                    <label for="email"
                                           class="form-label">
                                        Email Address
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        name="email"
                                        autocomplete="email"
                                        required>
                                </div>

                                <div class="col-12">
                                    <label for="phone"
                                           class="form-label">
                                        Phone Number
                                    </label>

                                    <input
                                        type="tel"
                                        class="form-control"
                                        id="phone"
                                        name="phone"
                                        autocomplete="tel"
                                        placeholder="Enter your phone number"
                                        required>
                                </div>
                    
                                <div class="col-12">
                                    <label for="address"
                                           class="form-label">
                                        Street Address
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="address"
                                        name="address"
                                        autocomplete="street-address"
                                        placeholder="House number and street"
                                        required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="city"
                                           class="form-label">
                                        City
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="city"
                                        name="city"
                                        autocomplete="address-level2"
                                        required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="postalCode"
                                           class="form-label">
                                        Postal Code
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="postalCode"
                                        name="postalCode"
                                        autocomplete="postal-code"
                                        inputmode="numeric"
                                        required>
                                </div>

                            </div>
                        </div>
                    </section>

                   
                    <section class="card shadow-sm">
                        <div class="card-body p-4">

                            <h2 class="h4 mb-3">Shipping Method</h2>

                            <div class="form-check border rounded p-3 mb-2">
                                <input
                                    class="form-check-input ms-0 me-2"
                                    type="radio"
                                    name="shipping"
                                    id="standard"
                                    value="standard"
                                    checked>

                                <label
                                    class="form-check-label"
                                    for="standard">
                                    <span class="fw-semibold">
                                        Standard Shipping
                                    </span>
                                    <span class="d-block small text-secondary">
                                        Delivery in 5–7 business days
                                    </span>
                                </label>

                                <span class="float-end fw-semibold">
                                    Free
                                </span>
                            </div>

                            <div class="form-check border rounded p-3 mb-2">
                                <input
                                    class="form-check-input ms-0 me-2"
                                    type="radio"
                                    name="shipping"
                                    id="express"
                                    value="express">

                                <label
                                    class="form-check-label"
                                    for="express">
                                    <span class="fw-semibold">
                                        Express Shipping
                                    </span>
                                    <span class="d-block small text-secondary">
                                        Delivery in 1–2 business days
                                    </span>
                                </label>

                                <span class="float-end fw-semibold">
                                    ₹150
                                </span>
                            </div>

                            <div class="form-check border rounded p-3">
                                <input
                                    class="form-check-input ms-0 me-2"
                                    type="radio"
                                    name="shipping"
                                    id="pickup"
                                    value="pickup">

                                <label
                                    class="form-check-label"
                                    for="pickup">
                                    <span class="fw-semibold">
                                        Store Pickup
                                    </span>
                                    <span class="d-block small text-secondary">
                                        Collect your order from the store
                                    </span>
                                </label>

                                <span class="float-end fw-semibold">
                                    Free
                                </span>
                            </div>

                        </div>
                    </section>

                </div>

                <div class="col-12 col-lg-5">

                    <section class="card shadow-sm">
                        <div class="card-body p-4">

                            <h2 class="h4 mb-4">Order Summary</h2>

                            <div class="d-flex justify-content-between
                                        align-items-start mb-3">
                                <div>
                                    <h3 class="h6 mb-1">
                                        Wireless Headphones
                                    </h3>
                                    <p class="text-secondary small mb-0">
                                        Quantity: 1
                                    </p>
                                </div>

                                <span>₹2,000</span>
                            </div>

                            <div class="d-flex justify-content-between
                                        align-items-start mb-3">
                                <div>
                                    <h3 class="h6 mb-1">
                                        Laptop Bag
                                    </h3>
                                    <p class="text-secondary small mb-0">
                                        Quantity: 1
                                    </p>
                                </div>

                                <span>₹1,000</span>
                            </div>

                            <hr>

                            
                            <label for="couponCode" class="form-label">
                                Coupon Code
                            </label>

                            <div class="input-group mb-2">
                                <input
                                    type="text"
                                    class="form-control"
                                    id="couponCode"
                                    placeholder="Enter coupon code"
                                    aria-label="Coupon code">

                                <button
                                    class="btn btn-outline-primary"
                                    type="button"
                                    id="applyCoupon">
                                    Apply
                                </button>
                            </div>

                            <p id="couponMessage"
                               class="small mb-3"
                               aria-live="polite"></p>

                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal</span>
                                <span id="subtotal">₹3,000</span>
                            </div>

                            <div class="d-flex justify-content-between mb-2">
                                <span>Shipping</span>
                                <span id="shippingCost">₹0</span>
                            </div>

                            <div class="d-flex justify-content-between mb-2">
                                <span>Discount</span>
                                <span id="discount">₹0</span>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between
                                        fw-bold fs-5 mb-4">
                                <span>Total</span>
                                <span id="total">₹3,000</span>
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100">
                                Place Order
                            </button>

                            <p class="small text-secondary text-center mt-3 mb-0">
                                Demo checkout — no payment will be processed.
                            </p>

                        </div>
                    </section>

                </div>

            </div>
        </form>

    </div>

    
    <script>
        const subtotal = 3000;
        const expressShippingCost = 150;

        let couponApplied = false;

        const shippingOptions =
            document.querySelectorAll('input[name="shipping"]');

        const shippingCostElement =
            document.getElementById("shippingCost");

        const discountElement =
            document.getElementById("discount");

        const totalElement =
            document.getElementById("total");

        const couponInput =
            document.getElementById("couponCode");

        const couponMessage =
            document.getElementById("couponMessage");

        const checkoutForm =
            document.getElementById("checkoutForm");

       
        function formatRupees(amount) {
            return "₹" + amount.toLocaleString("en-IN");
        }

        function updateTotal() {
            const selectedShipping =
                document.querySelector('input[name="shipping"]:checked');

            let shippingCost = 0;

            if (selectedShipping.value === "express") {
                shippingCost = expressShippingCost;
            }

            const discount = couponApplied
                ? subtotal * 0.10
                : 0;

            const total = subtotal + shippingCost - discount;

            shippingCostElement.textContent =
                formatRupees(shippingCost);

            discountElement.textContent =
                formatRupees(discount);

            totalElement.textContent =
                formatRupees(total);
        }

       
        shippingOptions.forEach(function(option) {
            option.addEventListener("change", updateTotal);
        });

        document.getElementById("applyCoupon")
            .addEventListener("click", function() {

                const enteredCode =
                    couponInput.value.trim().toUpperCase();

                if (enteredCode === "SAVE10") {
                    couponApplied = true;

                    couponMessage.textContent =
                        "Coupon applied! You saved 10%.";

                    couponMessage.className =
                        "small text-success mb-3";
                } else {
                    couponApplied = false;

                    couponMessage.textContent =
                        "Invalid coupon. Try SAVE10.";

                    couponMessage.className =
                        "small text-danger mb-3";
                }

                updateTotal();
            });

        checkoutForm.addEventListener("submit", function(event) {
            event.preventDefault();

            if (!checkoutForm.checkValidity()) {
                checkoutForm.reportValidity();
                return;
            }

            alert(
                "Checkout demo completed! Total: " +
                totalElement.textContent
            );
        });
        updateTotal();
    </script>

</body>
</html>
