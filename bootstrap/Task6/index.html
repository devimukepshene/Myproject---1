<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Three Column Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


    <section class="py-5">

        <div class="container">

            <h1 class="text-center mb-5">
                Dashboard
            </h1>


            <div class="row g-4">


                <div class="col-lg-4">

                    <div class="card shadow-sm h-100">

                        <div class="card-body text-center">

                            <h2 class="card-title">
                                Total Projects
                            </h2>

                            <p class="display-5 fw-bold text-primary">
                                25
                            </p>

                            <p class="card-text">
                                Projects completed successfully.
                            </p>

                        </div>

                    </div>

                </div>


                <div class="col-lg-4">

                    <div class="card shadow-sm h-100">

                        <div class="card-body text-center">

                            <h2 class="card-title">
                                Happy Clients
                            </h2>

                            <p class="display-5 fw-bold text-success">
                                18
                            </p>

                            <p class="card-text">
                                Clients worked with successfully.
                            </p>

                        </div>

                    </div>

                </div>


                <div class="col-lg-4">

                    <div class="card shadow-sm h-100">

                        <div class="card-body text-center">

                            <h2 class="card-title">
                                Experience
                            </h2>

                            <p class="display-5 fw-bold text-danger">
                                2+
                            </p>

                            <p class="card-text">
                                Years of professional experience.
                            </p>

                        </div>

                    </div>

                </div>


            </div>

        </div>

    </section>


</body>

</html>
