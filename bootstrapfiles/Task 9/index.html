
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Product Search</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="card shadow-sm mx-auto" style="max-width: 850px;">
            <div class="card-body p-4">

                <h1 class="h3 mb-2">Product Search</h1>
                <p class="text-secondary">
                    Search products by name and category.
                </p>

             
                <form id="searchForm">
 
                    <div class="mb-3">
                        <label for="searchInput" class="form-label">
                            Search by product name
                        </label>

                        <div class="input-group">
                            <input
                                type="search"
                                class="form-control"
                                id="searchInput"
                                placeholder="Enter product name..."
                                aria-label="Search by product name">

                            <button
                                class="btn btn-primary"
                                type="submit">
                                Advanced Search
                            </button>
                        </div>
                    </div>

                    <!-- Category Input Group -->
                    <div class="mb-3">
                        <label for="categorySelect" class="form-label">
                            Filter by category
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                Category
                            </span>

                            <select
                                class="form-select"
                                id="categorySelect"
                                aria-label="Filter by category">

                                <option value="all">
                                    All Categories
                                </option>

                                <option value="electronics">
                                    Electronics
                                </option>

                                <option value="clothing">
                                    Clothing
                                </option>

                                <option value="books">
                                    Books
                                </option>
                            </select>
                        </div>
                    </div>

                    <button
                        type="button"
                        class="btn btn-outline-secondary btn-sm"
                        id="clearButton">
                        Clear Filters
                    </button>

                </form>

                <hr class="my-4">

                <!-- Search Results -->
                <h2 class="h5 mb-3">Search Results</h2>

                <p id="resultCount" class="text-secondary"
                   aria-live="polite"></p>

                <div id="productList" class="row g-3"></div>

            </div>
        </div>

    </div>

    
    <script>
        
        const products = [
            {
                name: "Laptop",
                category: "electronics",
                price: 45000
            },
            {
                name: "Headphones",
                category: "electronics",
                price: 2000
            },
            {
                name: "Smartphone",
                category: "electronics",
                price: 18000
            },
            {
                name: "T-Shirt",
                category: "clothing",
                price: 700
            },
            {
                name: "Jeans",
                category: "clothing",
                price: 1500
            },
            {
                name: "JavaScript Guide",
                category: "books",
                price: 600
            },
            {
                name: "HTML and CSS Basics",
                category: "books",
                price: 450
            }
        ];


        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const categorySelect = document.getElementById("categorySelect");
        const productList = document.getElementById("productList");
        const resultCount = document.getElementById("resultCount");
        const clearButton = document.getElementById("clearButton");

  
        function displayProducts(filteredProducts) {
            productList.replaceChildren();

            resultCount.textContent =
                filteredProducts.length + " product(s) found";

            if (filteredProducts.length === 0) {
                const message = document.createElement("p");
                message.className = "text-danger";
                message.textContent =
                    "No products found. Try another search.";
                productList.appendChild(message);
                return;
            }

            filteredProducts.forEach(function(product) {
                const column = document.createElement("div");
                column.className = "col-12 col-md-6";

                const card = document.createElement("div");
                card.className = "card h-100";

                const cardBody = document.createElement("div");
                cardBody.className = "card-body";

                const title = document.createElement("h3");
                title.className = "h5 card-title";
                title.textContent = product.name;

                const category = document.createElement("p");
                category.className = "text-secondary mb-2";
                category.textContent =
                    "Category: " + product.category;

                const price = document.createElement("p");
                price.className = "fw-bold mb-0";
                price.textContent =
                    "Price: ₹" + product.price.toLocaleString("en-IN");

                cardBody.append(title, category, price);
                card.appendChild(cardBody);
                column.appendChild(card);
                productList.appendChild(column);
            });
        }

       
        function filterProducts() {
            const searchTerm = searchInput.value
                .trim()
                .toLowerCase();

            const selectedCategory = categorySelect.value;

            const filteredProducts = products.filter(function(product) {
                const matchesName = product.name
                    .toLowerCase()
                    .includes(searchTerm);

                const matchesCategory =
                    selectedCategory === "all" ||
                    product.category === selectedCategory;

                return matchesName && matchesCategory;
            });

            displayProducts(filteredProducts);
        }

       
        searchForm.addEventListener("submit", function(event) {
            event.preventDefault();
            filterProducts();
        });


        categorySelect.addEventListener("change", filterProducts);

        
        clearButton.addEventListener("click", function() {
            searchInput.value = "";
            categorySelect.value = "all";
            filterProducts();
            searchInput.focus();
        });

        displayProducts(products);
    </script>

</body>
</html>
