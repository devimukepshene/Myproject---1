
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Optimized Bootstrap Carousel</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .carousel-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
        }

        .carousel-caption {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 15px;
        }

        @media (max-width: 576px) {
            .carousel-image {
                height: 280px;
            }
        }
    </style>
</head>

<body class="bg-light">

    <main class="container py-5">

        <h1 class="text-center mb-3">
            Explore Beautiful Places
        </h1>

        <p class="text-center mb-4">
            Use the buttons or your keyboard arrow keys to navigate.
        </p>

        <!-- Accessible Carousel -->
        <div
            id="travelCarousel"
            class="carousel slide"
            role="region"
            aria-roledescription="carousel"
            aria-label="Travel destinations"
            tabindex="0"
        >
            <div class="carousel-inner" id="carouselContent">
            </div>

         
            <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="prev"
                aria-label="Previous slide"
            >
                <span
                    class="carousel-control-prev-icon"
                    aria-hidden="true"
                ></span>
            </button>

            <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="next"
                aria-label="Next slide"
            >
                <span
                    class="carousel-control-next-icon"
                    aria-hidden="true"
                ></span>
            </button>
        </div>

        <p
            id="slideStatus"
            class="text-center mt-3"
            aria-live="polite"
        >
            Slide 1 of 4
        </p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const slides = [
            {
                image: "https://picsum.photos/id/1018/1200/600",
                title: "Mountain Adventure",
                description: "Discover beautiful mountain landscapes.",
                alt: "Mountain landscape"
            },
            {
                image: "https://picsum.photos/id/1015/1200/600",
                title: "River Escape",
                description: "Enjoy peaceful views beside the river.",
                alt: "River flowing between mountains"
            },
            {
                image: "https://picsum.photos/id/1016/1200/600",
                title: "Forest Journey",
                description: "Explore the beauty of green forests.",
                alt: "Green forest landscape"
            },
            {
                image: "https://picsum.photos/id/1019/1200/600",
                title: "Nature Retreat",
                description: "Find a new place to explore.",
                alt: "Beautiful outdoor landscape"
            }
        ];

        const carouselElement =
            document.getElementById("travelCarousel");

        const carouselContent =
            document.getElementById("carouselContent");

        const slideStatus =
            document.getElementById("slideStatus");


        slides.forEach((slide, index) => {
            const item = document.createElement("div");

            item.className = index === 0
                ? "carousel-item active"
                : "carousel-item";

            item.setAttribute("role", "group");
            item.setAttribute("aria-roledescription", "slide");
            item.setAttribute(
                "aria-label",
                `${index + 1} of ${slides.length}: ${slide.title}`
            );

            const image = document.createElement("img");

            image.src = slide.image;
            image.alt = slide.alt;
            image.className = "d-block carousel-image";

            
            if (index === 0) {
                image.loading = "eager";
                image.fetchPriority = "high";
            } else {
                image.loading = "lazy";
            }

            const caption = document.createElement("div");
            caption.className = "carousel-caption";

            const title = document.createElement("h2");
            title.className = "h5";
            title.textContent = slide.title;

            const description = document.createElement("p");
            description.className = "mb-0";
            description.textContent = slide.description;

            caption.appendChild(title);
            caption.appendChild(description);

            item.appendChild(image);
            item.appendChild(caption);

            carouselContent.appendChild(item);
        });


        const carousel = new bootstrap.Carousel(carouselElement, {
            interval: false,
            keyboard: false,
            ride: false,
            touch: true
        });


        function preloadNextImage(currentIndex) {
            const nextIndex = (currentIndex + 1) % slides.length;

            const imageToPreload = new Image();
            imageToPreload.src = slides[nextIndex].image;
        }

        preloadNextImage(0);


        carouselElement.addEventListener("slid.bs.carousel", (event) => {
            const currentIndex = Array.from(
                carouselContent.querySelectorAll(".carousel-item")
            ).indexOf(event.relatedTarget);

            slideStatus.textContent =
                `Slide ${currentIndex + 1} of ${slides.length}`;

            preloadNextImage(currentIndex);
        });


        carouselElement.addEventListener("keydown", (event) => {
            if (event.altKey || event.ctrlKey ||
                event.metaKey || event.shiftKey) {
                return;
            }

            if (event.target.closest(
                "input, textarea, select, [contenteditable='true']"
            )) {
                return;
            }

            if (event.key === "ArrowRight") {
                event.preventDefault();
                carousel.next();
            }

            if (event.key === "ArrowLeft") {
                event.preventDefault();
                carousel.prev();
            }
        });
    </script>

</body>
</html>
