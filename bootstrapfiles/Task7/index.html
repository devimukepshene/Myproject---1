
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-7 col-lg-6">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h1 class="text-center mb-4">
                            Expense Tracker
                        </h1>

                        <form>

                            <div class="mb-3">

                                <label for="expenseName" class="form-label">
                                    Expense Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="expenseName"
                                    name="expenseName"
                                    placeholder="Example: Shopping"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label for="cost" class="form-label">
                                    Expense Amount
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">$</span>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="cost"
                                        name="cost"
                                        placeholder="Enter amount"
                                        min="0"
                                        step="0.01"
                                        required
                                    >

                                </div>

                            </div>


                            <div class="mb-3">

                                <label for="tax" class="form-label">
                                    Tax Percentage
                                </label>

                                <div class="input-group">

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="tax"
                                        name="tax"
                                        placeholder="Enter tax rate"
                                        min="0"
                                        max="100"
                                        step="0.01"
                                        required
                                    >

                                    <span class="input-group-text">%</span>

                                </div>

                            </div>


                           
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Add Expense
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
