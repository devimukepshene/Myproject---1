
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Landing Page</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Travel World</a>
        </div>
    </nav>

    <section class="container my-4">

        <h1 class="text-center mb-4">
            Explore Beautiful Places
        </h1>

        <div
            id="travelCarousel"
            class="carousel slide"
            data-bs-ride="carousel"
        >

            <div class="carousel-indicators">
                <button
                    type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide-to="0"
                    class="active"
                    aria-current="true"
                    aria-label="Slide 1"
                ></button>

                <button
                    type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide-to="1"
                    aria-label="Slide 2"
                ></button>

                <button
                    type="button"
                    data-bs-target="#travelCarousel"
                    data-bs-slide-to="2"
                    aria-label="Slide 3"
                ></button>
            </div>

            <!-- Carousel Images -->
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img
                        src="https://picsum.photos/id/1018/1200/500"
                        class="d-block w-100"
                        alt="Mountain landscape"
                    >

                    <div class="carousel-caption">
                        <h5>Explore the Mountains</h5>
                        <p>Discover beautiful natural landscapes.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img
                        src="https://picsum.photos/id/1015/1200/500"
                        class="d-block w-100"
                        alt="River and mountains"
                    >

                    <div class="carousel-caption">
                        <h5>Enjoy Nature</h5>
                        <p>Relax and enjoy peaceful surroundings.</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img
                        src="https://picsum.photos/id/1016/1200/500"
                        class="d-block w-100"
                        alt="Beautiful forest"
                    >

                    <div class="carousel-caption">
                        <h5>Start Your Adventure</h5>
                        <p>Find your next favourite destination.</p>
                    </div>
                </div>

            </div>

            <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="prev"
            >
                <span class="carousel-control-prev-icon"
                      aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#travelCarousel"
                data-bs-slide="next"
            >
                <span class="carousel-control-next-icon"
                      aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>

        </div>

    </section>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
